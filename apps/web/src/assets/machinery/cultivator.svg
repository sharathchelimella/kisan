    <path d="M50 16L42 36H58L50 16Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5" />
    <circle cx="50" cy="20" r="2.5" fill="#1F2937" stroke="#F3F4F6" stroke-width="0.8" />
    
    <!-- Main Heavy Duty Frame Bars (Blue) -->
    <rect x="15" y="34" width="70" height="7" rx="2" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.2" />
    <rect x="22" y="43" width="60" height="6" rx="2" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1" />
    
    <!-- Heavy Duty Springs & Mount Brackets -->
    <g fill="#4B5563" stroke="#1F2937" stroke-width="1">
      <circle cx="26" cy="37" r="3.5" />
      <circle cx="40" cy="37" r="3.5" />
      <circle cx="54" cy="37" r="3.5" />
      <circle cx="68" cy="37" r="3.5" />
      <circle cx="82" cy="37" r="3.5" />
    </g>
    
