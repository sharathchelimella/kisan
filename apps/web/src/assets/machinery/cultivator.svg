    <g stroke="#1F2937" stroke-width="3" stroke-linecap="round">
      <path d="M26 40C24 52 28 62 23 72" />
      <path d="M40 40C38 52 42 62 37 72" />
      <path d="M54 40C52 52 56 62 51 72" />
      <path d="M68 40C66 52 70 62 65 72" />
      <path d="M82 40C80 52 84 62 79 72" />
    </g>
    <!-- Shovel Points -->
    <path d="M21 72L25 72L22 75Z" fill="#F59E0B" />
    <path d="M35 72L39 72L36 75Z" fill="#F59E0B" />
    <path d="M49 72L53 72L50 75Z" fill="#F59E0B" />
    <path d="M63 72L67 72L64 75Z" fill="#F59E0B" />
    <path d="M77 72L81 72L78 75Z" fill="#F59E0B" />
  </g>
</svg>